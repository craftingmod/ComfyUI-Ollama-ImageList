[project]
name = "comfyui-ollama-multimodal"
description = "ComfyUI V3 nodes for one-shot Ollama multimodal requests with heterogeneous image lists"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }

[dependency-groups]
dev = [
  "pytest>=8.4.2",
]

[project.urls]
Repository = "https://github.com/craftingmod/ComfyUI-Ollama-Multimodal"

[tool.comfy]
PublisherId = "craftingmod"
DisplayName = "Multimodal Ollama"
requires-comfyui = ">=0.18.1"
