[project]
name = "ollama-image-list"
description = "Analyze ComfyUI image, audio, and video lists with Ollama, llama.cpp GGUF, or native generative CLIP backends"
version = "0.7.0"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }

[project.optional-dependencies]
llama = [
  "llama-cpp-python",
  "makoto-decision",
]

[dependency-groups]
dev = ["av>=16.0.0", "pytest>=9.1.1", "pytest-xdist>=3.8.0", "ruff>=0.16.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/craftingmod/ComfyUI-Ollama-ImageList"

[tool.comfy]
PublisherId = "alyac"
DisplayName = "Ollama-ImageList"
requires-comfyui = ">=0.19.3"
Icon = "https://cdn.jsdelivr.net/gh/craftingmod/ComfyUI-Ollama-ImageList@latest/docs/icon.svg"
includes = ["dist"]

[tool.uv.sources]
llama-cpp-python = { git = "https://github.com/JamePeng/llama-cpp-python.git", branch = "main" }
