[project]
name = "ollama-image-list"
description = "Analyze ComfyUI media lists through Ollama or native llama.cpp backends"
version = "0.5.0"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }

[dependency-groups]
dev = [
  "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/craftingmod/ComfyUI-Ollama-ImageList"

[tool.comfy]
PublisherId = "alyac"
DisplayName = "Ollama-ImageList"
requires-comfyui = ">=0.19.3"
Icon = "https://cdn.jsdelivr.net/gh/craftingmod/ComfyUI-Ollama-ImageList@latest/docs/icon.svg"
