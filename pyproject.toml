[project]
name = "comfyui-ollama-image-list"
description = "Send mixed-resolution ComfyUI IMAGE data lists to Ollama in one request"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }

[dependency-groups]
dev = [
  "pytest>=8.4.2",
]

[project.urls]
Repository = "https://github.com/craftingmod/ComfyUI-Ollama-ImageList"

[tool.comfy]
PublisherId = "alyac"
DisplayName = "Ollama-ImageList"
requires-comfyui = ">=0.18.1"
