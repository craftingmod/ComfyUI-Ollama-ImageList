[project]
name = "ollama-image-list"
description = "Analyze ComfyUI image lists and audio with Ollama or llama.cpp"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }

[dependency-groups]
dev = [
  "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/craftingmod/ComfyUI-Ollama-ImageList"

[tool.comfy]
PublisherId = "alyac"
DisplayName = "Ollama-ImageList"
requires-comfyui = ">=0.18.1"
Icon = "https://cdn.jsdelivr.net/gh/craftingmod/ComfyUI-Ollama-ImageList@latest/docs/icon.svg"
